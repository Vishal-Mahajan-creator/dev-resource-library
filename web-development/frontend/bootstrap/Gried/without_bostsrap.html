<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gried</title>
    <style>
        .mycol {
            width: 333px;
            height: 200px;
            background: red;
            border: 2px solid black;
        }

        .myrow {
            border: 2px dashed black;
            background: none;
        }

        .myrow>* {
            display: inline-block;
            width: 33%;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="myrow">
            <div class="mycol">This is col 1</div>
            <div class="mycol">This is col 2</div>
            <div class="mycol">This is col 3</div>
            <div class="mycol">This is col 4</div>
            <div class="mycol">This is col 5</div>
            <div class="mycol">This is col 6</div>
            <div class="mycol">This is col 7</div>
            <div class="mycol">This is col 8</div>
            <div class="mycol">This is col 9</div>
            <div class="mycol">This is col 10</div>
            <div class="mycol">This is col 11</div>
            <div class="mycol">This is col 12</div>

        </div>
    </div>
    <script>
        const allCols = document.querySelectorAll(".myrow.mycol");
        console.log(allCols);
        const num_of_cols = allCols.length;
        console.log(num_of_cols);
        const newwidth = 100 / num_of_cols;
        console.log("New width:-", newwidth);

    </script>
</body>

</html>
