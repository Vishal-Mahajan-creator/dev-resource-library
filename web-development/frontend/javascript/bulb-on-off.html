<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulb on off</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: gold;
        }

        #container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: 90px;
        }

        #bulbimg {
            width: 400px;
            height: 685px;
        }

        button {
            padding: 50px 50px;
            font-size: 29px;

            border: 4px solid white;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 50%;
        }

        .off{
            background-color: red;
        }

        .on {
            background-color: green;
        }

        .off:hover, .on:hover {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>

    <h1 style="font-size: 50px; background-color: black; color: white; margin-top: 0;">Bulb ON/OFF</h1>

    <div id="container">
        <button type="button" class="off"
            onclick="document.getElementById('bulbimg').src='bulb-off.png'">
            Off
        </button>

        <img id="bulbimg" src="bulb-off.png" alt="Bulb Image">

        <button type="button" class="on"
            onclick="document.getElementById('bulbimg').src='bulb-on.png'">
            On
        </button>
    </div>

</body>
</html>
