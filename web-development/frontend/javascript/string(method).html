<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Method</title>
</head>
<body>
    <h1 style="text-align: center;">String Methods    </h1>
    <h3>
    <p id="demo"></p></h3>
    <script>
        let text1="HI Vishal Sir";
        let text2=text1.toLocaleLowerCase();
        let text3=text1.toLocaleUpperCase();
        let text4=text1.charAt(4);
        let text5=text1.slice(3,9);
        



        document.getElementById("demo").innerHTML+="Main Text:-" +text1 +"<br><br>";
        document.getElementById("demo").innerHTML+="Convert the text into Lower case using method[toLocaleLowerCase()]:-" +text2 +"<br><br>";
        document.getElementById("demo").innerHTML+="Convert the text into upper case using method[toLocaleUpperCase()]:-"+text3 +"<br><br>";
        document.getElementById("demo").innerHTML+="Select the characater at [4]using method[charAt(4)]:-"+text4 +"<br><br>";
        document.getElementById("demo").innerHTML+="Slice the text using method[slice()]:-" +text5+ "<br><br>";
        document.getElementById("demo").innerHTML+="Adding a new text using method[concat()] :-" +text1.concat(" ","Good Morning")+ "<br><br>";
        document.getElementById("demo").innerHTML+="Split the text using method[split()]:-" +text1.split("")+"<br><br>";
        document.getElementById("demo").innerHTML+="Replase the text using method[replace()]:-" +text1.replace("Sir","Pailwan")+ "<br><br>";
        document.getElementById("demo").innerHTML+="Replase the text using method[replace()]:-" +text1.repeat(4)+ "<br><br>";



    </script>
</body>
</html>
