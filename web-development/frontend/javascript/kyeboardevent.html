<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Board Events</title>
    <style>
        body{
            text-align: center;
            background-color:aliceblue;
        }
    </style>
</head>
<body>
    <h3>Press any key</h3>
    <div id="output"></div>
    
    

    <script>
        document.addEventListener('keydown', function(event) {
            document.getElementById('output').innerHTML = "Key press: " + event.key + "<br>";
        });

        document.addEventListener('keypress', function(event) {
            document.getElementById('output').innerHTML += "Character press: " + event.key + "<br>";
        });

        document.addEventListener('keyup', function(event) {
            document.getElementById('output').innerHTML += "Key released: " + event.key +'<br>Key code: ' + event.keyCode ;
        });

    
    </script>
</body>
</html>
