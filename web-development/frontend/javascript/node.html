<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node</title>
</head>
<body>
<h1>Hello ji!</h1>
<div id="demo">
    <p id="p1">Jai Shree Ram</p>

    <p id="p2">Om Namah Shivay</p>
    <p id="p3">Om Namah Shivay</p>
    <p id="p4">Aadesh</p>
    <p id="p5">Om Namah Shivay</p>


</div>
<script>
    const a1=document.createElement("p");
    const a2=document.createTextNode("Jai Shivray");
    a1.appendChild(a2);
    
    const add=document.getElementById("demo");
    add.appendChild(a1);
    const child=document.getElementById("p1");
    add.insertBefore(a1,child);
 
    const child1=document.getElementById("p3");child1.remove();
    const child2=document.getElementById("p5");add.removeChild(child2);



</script>
</body>
</html>
