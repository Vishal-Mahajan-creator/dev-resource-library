<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Creation</title>
  </head>
  <body>
    <form>
      <label>Select date:-</label><input type="date" /><br /><br />
      <label>Time</label><input type="time" /><br /><br />
      <label>Date time:-</label><input type="datetime" /><br /><br />
      <label>Date Time Local:-</label
      ><input type="datetime-local" /><br /><br />
      <label> Month:-</label><input type="month" /><br /><br />
      <label>Week:-</label><input type="week" /><br /><br />
      <label>Colour:-</label><input type="color" /><br /><br />
      <label>Rang:-</label><input type="range" max="100" /><br /><br />

      <label>Gender:-</label><input type="radio" name="male" />Male
      <input type="radio" name="Female" />Female <br /><br />

      Select State:- <br />
      <select>
        <option>Mumbai</option>
        <option>Pune</option>
        <option>Statara</option>
        <option>Dhule</option></select
      ><br /><br />

      Select Subject:-
      <input type="checkbox" name="s1" />English <br /><br />
      <input type="checkbox" name="s2" />IT <br /><br />

      Name of the inital value of from:-<input
        type="text"
        name="Firtmae"
      /><br /><br />

      <label>ID:-</label><input type="number" id="Form1" /><br /><br />

      <label>Required:-</label><input type="text" required /><br /><br />

      <label>Autofocus:-</label><input type="text" autofocus /><br /><br />
      <label>Enyter name(Placeholder):-</label
      ><input type="text" placeholder="Enter name" /><br /><br />

      <label>Max lenth and Mib lenth:-</label
      ><input type="text" minlength="1" maxlength="10" /><br /><br />                                

      <label>Readonly:-</label><input type="text" readonly /><br /><br />

      <label>File:-</label><input type="file" name="select file" /><br /><br />
      <input type="submit" name="Submit" />
    </form>
  </body>
</html>
