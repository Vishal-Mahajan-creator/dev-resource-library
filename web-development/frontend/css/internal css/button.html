<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button</title>
    <style>
      .button {
        background-color: #4caf50;
        border: none;
        text-align: center;
        padding: 11px 15px;
        margin: 11px 14px;
        display: inline-block;
        font-size: 20px;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <button>Default Button</button>
    <a href="#" class="button" target="_blank">Link Button</a>
    <button class="button">Button</button>
    <input type="button" class="text" value="Input button" />
  </body>
</html>
