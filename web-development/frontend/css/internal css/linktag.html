<html>
  <head>
    <title>Link Tag</title>
    <style>
      .a1 {
        display: inline-block;
        padding: 30px 30px;
        margin: 10%;
        font-size: 23px;
        text-align: center;
        text-decoration: dotted gold 2px;

        color: aqua;
        background-color: black;
        border-radius: 50%;
      }
      /*hover effect*/
      .a1:hover {
        color: orange;
      }

      .a1:active {
        color: rgb(3, 20, 255);
      }
      a:link {
        color: red;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Welcome to your Web site!</h1>

      <a href="https://www.greenfeather.in/" target="_blank" class="a1"
        >Hari Bol Nursery & Landscaping</a
      ><br />
      <table border="2" align="center">
        <tr>
          <th rowspan="2">
            <a href="https://www.greenfeather.in/services">Our service</a>
          </th>
          <th rowspan="2">
            <a href="https://www.greenfeather.in/projects">Our projects</a>
          </th>
        </tr>
      </table>
    </div>
  </body>
</html>
