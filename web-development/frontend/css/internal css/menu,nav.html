<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu/Nav</title>
    <style>
      

        ul{
            list-style-type:none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: black;
           
        }
        li {
            float:left;
        }
        .h1:hover{
            background-color: rgb(240, 6, 6);
        }
        .h1{
            background-color: rgb(238, 255, 3);
        }
        li a{
            display: inline-block;
            text-align: center;
            text-decoration: underline;
            padding: 14px 16px;
        }
        

    </style>
</head>
<body style="text-decoration-color: white;">
    <div class="color-box">
    <ul>
        <li><a href="#home" target="_blank" class="h1">Home</a></li>
        <li><a href="#about" target="_blank">About</a></li>
        <li><a href="#contact" target="_blank" >Contact</li>
        <li style="float: right;"><a href="#help" target="_blank" >Help</li>
    </ul>
    </div>
</body>
</html>
