<html>
  <head>
    <title>Border</title>
    <style>
      p.solid {
        border-style: solid;
        border-color: brown;
        background-color: black;
        color: white;
      }
      p.dotted {
        border-style: dotted;
        border-color: aqua;
      }
      p.dashed {
        border-style: dashed;
        border-color: red;
      }
      p.double {
        border-style: double;
        border-color: orange;
      }
      p.groove {
        border-style: groove;
        border-color: chartreuse;
      }
      p.ridge {
        border-style: ridge;
        border-color: darkgoldenrod;
      }
      p.inset {
        border-style: inset;
        border-color: darkblue;
      }
      p.outset {
        border-style: outset;
        border-color: darkred;
      }
      p.none {
        border-style: none;
        border-color: crimson;
      }
      p.hidden {
        border-style: hidden;
      }
      p.mixed {
        border-style: inset outset solid double;
      }
    </style>
  </head>
  <body>
    <p class="solid">This is Solid Border</p>
    <p class="dotted">This is dotted Border</p>
    <p class="dashed">This is dashed Border</p>
    <p class="double">This is double Border</p>
    <p class="groove">This is groove Border</p>
    <p class="ridge">This is ridge Border</p>
    <p class="inset">This is inset Border</p>
    <p class="outset">This is outset Border</p>
    <p class="none">This is none Border</p>
    <p class="hidden">This is hidden Border</p>
    <p class="mixed">This is mixed Border</p>
  </body>
</html>
