<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        flex-direction: column;
        background-color: #f0f0f0;
      }
      .container {
        display: grid;
        background-color: black;
        padding: 30px;
        width: 300px;
        grid-template-columns: auto auto auto;
      }
      .container > div {
        background-color: white;
        color: black;
        margin: 5px;
        padding: 10px;
        line-height: 50px;
        text-align: center;
        border: 3px solid black;
        border-radius: 40%;
      }

         .call-btn {
        background-color: green !important;
        color: white !important;
        font-weight: bold;
        font-size: 20px;
        cursor: pointer;
        transition: background-color 0.3s;
      }
     
      .call-btn:hover {
        background-color:greenyellow !important;
      }

      .call-btn a {
        color: white;
        text-decoration: none;
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <h1 style="text-align: center">Grid Container</h1>
    <div class="container">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
      <div>7</div>
      <div>8</div>
      <div>9</div>
      <div>#</div>
      <div>0</div>
      <div>*</div>
       <div class="call-btn" style="grid-column: span 3">
        <a href="tel:+1234567890">Call</a>
    </div>
  </body>
</html>
