<html>
<head>
    <title>Direction</title>
    <style>
        p1.a{
        direction: rtl;
        unicode-bidi: bidi-override;
        }
        h1{
            text-decoration: underline;
            color: orange;
            text-decoration-style:double ;
            text-decoration-color:goldenrod ;
        }
         h2.a3{
            text-decoration: overline;
            color: rgb(255, 0, 64);
            text-decoration-style:dashed;
            text-decoration-color:rgb(117, 64, 106) ;
        }
        h2.a4{
            text-shadow: 2px 3px 2px aqua;
            text-indent: 20%;
        }
         h3{
            text-decoration: line-through;
            color: rgb(255, 0, 64);
            text-decoration-style:bold solid;
            text-decoration-color:rgb(245, 245, 245) ;
        }
        h4.a1{
            text-transform: uppercase;
            letter-spacing: 5px;
            line-height: 150px;
        }
         h4.a2{
            text-transform: lowercase;
            
        }
        
        
    </style>
</head>
<body>
    
    <h1>Jai Sree RAM</h1>
    <h2 class="a3">The King Maker</h2>
    <h2 class="a4">The King Maker</h2>

    <h3>Hello Ji</h3>
    <h4 class="a1">Hello everyone(upper case)</h4>
    <h4 class="a2">Hello everyone(lower case)</h4>

    <p1 class="a">Style the header with a large padding, centered text, a specific background-color and a big sized text:</p>
    </body>
</html>
